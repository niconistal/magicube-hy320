[package]
name = "magicube"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Set up and control a Magcubic HY320 Pro projector over adb — no adb install needed"
license = "MIT"
repository = "https://github.com/niconistal/magicube-hy320"
exclude = ["grab/target"]

[features]
default = ["usb"]
# USB A-to-A cable support (builds libusb from source)
usb = ["adb_client/usb"]

[dependencies]
adb_client = { version = "3.2", default-features = false }
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
png = "0.18"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
ureq = "2"
zstd = "0.13"

[profile.release]
lto = true
strip = true
codegen-units = 1
